<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#121212">
    <link rel="canonical" href="https://ludus-app.github.io/">
    <link rel="icon" type="image/png" href="icona.png">
    <title>Ludus</title>
    <style>
        body { margin: 0; min-height: 100vh; background: #121212; color: #f3ede2; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 0 24px; box-sizing: border-box; font: 16px/1.5 system-ui, sans-serif; text-align: center; }
        h1 { color: #F0BC42; letter-spacing: 6px; margin: 0; font-size: 28px; }
        a.nuova { background: #F0BC42; color: #241a00; text-decoration: none; font-weight: 600; border-radius: 24px; padding: 12px 24px; }
        a.vecchia { color: #F0BC42; }
        p { max-width: 420px; margin: 0; }
    </style>
</head>
<body>
<h1>LUDUS</h1>
<p>Ludus ha un indirizzo nuovo.</p>
<a class="nuova" href="https://ludus-app.github.io/">Apri ludus-app.github.io</a>
<p id="dati" hidden>Hai dati salvati qui? <a class="vecchia" href="vecchia.html">Apri la versione vecchia</a>, esporta un backup da Account, Impostazioni, e ripristinalo nell'indirizzo nuovo.</p>
<script>
    var usata = false;
    try { usata = localStorage.length > 0; } catch (e) {}
    if (usata) document.getElementById('dati').hidden = false;
    else location.replace('https://ludus-app.github.io/');
</script>
</body>
</html>
